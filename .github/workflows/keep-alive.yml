name: Keep Services Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC
    - cron: "0 8 */5 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase sign-in (keep-alive)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          KEEPALIVE_EMAIL: seemless.chat@gmail.com
          KEEPALIVE_PASSWORD: admin1234
        run: |
          set -e

          # A real password sign-in against GoTrue counts as genuine user
          # activity and resets the free-tier inactivity/pause timer, whereas
          # a plain REST ping against an empty schema does not.
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$KEEPALIVE_EMAIL\",\"password\":\"$KEEPALIVE_PASSWORD\"}")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "Supabase auth responded with HTTP $status"

          if [ "$status" -ne 200 ]; then
            echo "✗ Supabase sign-in failed"
            echo "Response body: $body"
            exit 1
          fi

          echo "✓ Supabase sign-in succeeded"

          access_token=$(echo "$body" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

          if [ -n "$access_token" ]; then
            curl -s -o /dev/null -X POST "$SUPABASE_URL/auth/v1/logout" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $access_token" || true
            echo "✓ Signed out keep-alive session"
          fi

      - name: Exercise Upstash Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -eo pipefail

          # Strip any trailing slash from the REST URL so we don't end up with
          # double slashes in the paths below.
          base="${UPSTASH_REDIS_REST_URL%/}"
          key="keepalive:$(date -u +%Y%m%d%H%M%S)"
          value="alive-$GITHUB_RUN_ID"

          # Run commands via the URL-path REST form (POST $URL/cmd/arg1/arg2).
          # Unlike the /pipeline JSON body form, this path has no JSON parsing
          # so it can't trip on whitespace, quoting, or content-type quirks.
          # Four sequential round-trips is fine here — more activity is better
          # for the free-tier keep-alive anyway.
          run_cmd() {
            local label="$1"
            local method="$2"
            local path="$3"
            local response status body
            response=$(curl -sS -w "\n%{http_code}" \
              -X "$method" "$base/$path" \
              -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN")
            body=$(echo "$response" | sed '$d')
            status=$(echo "$response" | tail -n1)
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "✗ $label failed (HTTP $status): $body"
              return 1
            fi
            echo "  $label → HTTP $status $body"
          }

          echo "→ Exercising Upstash Redis"
          run_cmd "SETEX" POST "setex/$key/3600/$value"
          run_cmd "GET"   GET  "get/$key"
          run_cmd "INCR"  POST "incr/keepalive:counter"
          run_cmd "DEL"   POST "del/$key"

          echo "✓ Upstash Redis commands executed successfully"
