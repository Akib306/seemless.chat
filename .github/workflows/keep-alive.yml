name: Keep Services Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC
    - cron: "0 8 */5 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -sf -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
            echo "✓ Supabase is alive"
          else
            echo "✗ Supabase ping failed"
            exit 1
          fi

      - name: Ping Upstash Redis
        run: |
          response=$(curl -sf -o /dev/null -w "%{http_code}" \
            "${{ secrets.UPSTASH_REDIS_REST_URL }}/ping" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          echo "Upstash Redis responded with HTTP $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
            echo "✓ Upstash Redis is alive"
          else
            echo "✗ Upstash Redis ping failed"
            exit 1
          fi
