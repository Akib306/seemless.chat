name: Keep Services Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC
    - cron: "0 8 */5 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✓ Supabase is alive"
          else
            echo "✗ Supabase ping failed"
            exit 1
          fi

      - name: Exercise Upstash Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -e
          key="keepalive:$(date -u +%Y%m%d%H%M%S)"
          value="alive-$GITHUB_RUN_ID"

          # Pipeline a real SET (with 1 hour TTL), GET, INCR, and DEL so the
          # database registers actual command usage rather than just a PING.
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "$UPSTASH_REDIS_REST_URL/pipeline" \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[
              [\"SET\", \"$key\", \"$value\", \"EX\", \"3600\"],
              [\"GET\", \"$key\"],
              [\"INCR\", \"keepalive:counter\"],
              [\"DEL\", \"$key\"]
            ]")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "Upstash Redis responded with HTTP $status"
          echo "Response body: $body"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✓ Upstash Redis commands executed successfully"
          else
            echo "✗ Upstash Redis command execution failed"
            exit 1
          fi
